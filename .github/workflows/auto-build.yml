name: LaTeX Documentation Build

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install TeX Live dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            latexmk \
            texlive-latex-base \
            texlive-latex-recommended \
            texlive-luatex \
            texlive-lang-chinese \
            texlive-latex-extra \
            texlive-pictures \
            lmodern

      - name: Verify l3build
        run: l3build --version

      - name: Build with l3build (build.lua)
        run: l3build doc

      - name: Collect PDF artifacts
        run: |
          mkdir -p artifacts
          if [ -d build/doc ]; then
            find build/doc -maxdepth 1 -type f -name '*.pdf' -exec cp {} artifacts/ \;
          fi
          if [ -f main.pdf ]; then
            cp main.pdf artifacts/
          fi
          if [ -z "$(find artifacts -maxdepth 1 -type f -name '*.pdf' -print -quit)" ]; then
            echo "No PDF artifacts found in build/doc or repository root. Check l3build output for compilation errors."
            exit 1
          fi

      - name: Upload PDF artifact
        uses: actions/upload-artifact@v4
        with:
          name: pdf-output
          path: artifacts/
          if-no-files-found: error
