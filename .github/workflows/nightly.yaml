name: Nightly PDF Release

on:
    schedule:
        # 每天 UTC 00:00（北京时间 08:00）自动触发
        - cron: "0 0 * * *"
    workflow_dispatch:

jobs:
    nightly-release:
        permissions:
            contents: write
        runs-on: ubuntu-latest
        steps:
            - name: Checkout repository
              uses: actions/checkout@v6

            - name: Get date
              run: |
                  echo "DATE=$(date -u +%Y-%m-%d)" >> $GITHUB_ENV
                  echo "DATE_COMPACT=$(date -u +%Y%m%d)" >> $GITHUB_ENV

            - name: Install TeX Live
              uses: zauguin/install-texlive@v4
              with:
                  package_file: .github/tl_packages

            - name: Run l3build
              run: l3build doc

            - name: Prepare release PDF
              run: |
                  PDF_NAME="math-analysis-vol2-solutions_nightly_${DATE}.pdf"
                  cp main.pdf "$PDF_NAME"
                  echo "PDF_NAME=$PDF_NAME" >> $GITHUB_ENV
                  test -f "$PDF_NAME"

            - name: Create version tag
              run: |
                  TAG_NAME="nightly-${DATE}"
                  RLS_NAME='"Mathematical Analysis (Volume II)" Exercise Solutions Nightly '"$DATE"

                  echo "TAG_NAME=$TAG_NAME" >> $GITHUB_ENV
                  echo "RLS_NAME=$RLS_NAME" >> $GITHUB_ENV

                  git fetch --tags
                  if git rev-parse "$TAG_NAME" >/dev/null 2>&1; then
                    echo "Tag $TAG_NAME already exists. Skipping tag creation."
                  else
                    git tag $TAG_NAME
                    git push origin $TAG_NAME
                  fi

            - name: Create and Publish Release
              uses: softprops/action-gh-release@v3
              with:
                  tag_name: ${{ env.TAG_NAME }}
                  name: ${{ env.RLS_NAME }}
                  files: ${{ env.PDF_NAME }}
                  prerelease: true
                  body: |
                      🌙 **Nightly Build** — ${{ env.DATE }}

                      This is an automated nightly build. It may contain errors or incomplete content.
                      For stable releases, please visit the [Releases page](../../releases).
              env:
                  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
